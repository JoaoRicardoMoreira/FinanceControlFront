<header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
  <div>
    <h1 class="text-3xl font-bold text-emerald-400">Controle Financeiro</h1>
    <p class="text-gray-400">Gerencie suas finanças de forma simples e eficiente</p>
  </div>
  <div class="flex flex-wrap justify-center gap-2">
    <div class="flex bg-gray-800 p-1 rounded-lg border border-gray-700 mr-2">
      <select
        [ngModel]="month"
        (ngModelChange)="monthChange.emit($event)"
        class="bg-transparent text-sm px-2 py-1 outline-none border-r border-gray-700"
      >
        <option [ngValue]="'all'">Todos os Meses</option>
        <option *ngFor="let m of months; index as i" [ngValue]="i">{{ m }}</option>
      </select>
      <select
        [ngModel]="year"
        (ngModelChange)="yearChange.emit($event)"
        class="bg-transparent text-sm px-2 py-1 outline-none"
      >
        <option *ngFor="let y of yearOptions" [ngValue]="y">{{ y }}</option>
      </select>
    </div>
    <button
      (click)="openRecorrentes.emit()"
      class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg transition flex items-center gap-2 text-sm"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Recorrentes
    </button>
    <button
      (click)="exportCsv.emit()"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition flex items-center gap-2 text-sm"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
      Exportar
    </button>
    <label
      class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg transition flex items-center gap-2 text-sm cursor-pointer"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
      </svg>
      Importar
      <input type="file" accept=".csv" class="hidden" (change)="onImport($event)" />
    </label>
    <button
      (click)="openRenda.emit()"
      class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 px-4 py-2 rounded-lg transition flex items-center gap-2 text-sm"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path
          fill-rule="evenodd"
          d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
          clip-rule="evenodd"
        />
      </svg>
      Nova Renda
    </button>
  </div>
</header>
