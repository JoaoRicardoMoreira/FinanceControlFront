<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
  <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
    <p class="text-gray-400 text-sm mb-1">Saldo no Período</p>
    <h2 class="text-3xl font-bold text-white">{{ currency(saldo) }}</h2>
    <div [class]="saldoStatusClass">{{ saldoStatusText }}</div>
  </div>
  <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
    <p class="text-gray-400 text-sm mb-1">Renda no Período</p>
    <h2 class="text-3xl font-bold text-emerald-400">{{ currency(totalRenda) }}</h2>
  </div>
  <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
    <p class="text-gray-400 text-sm mb-1">Gasto vs Meta (Período)</p>
    <h2 class="text-3xl font-bold text-rose-400">{{ currency(totalGasto) }}</h2>
    <div class="w-full bg-gray-700 rounded-full h-2 mt-3">
      <div [class]="progressClass" [style.width.%]="progress"></div>
    </div>
  </div>
</div>
