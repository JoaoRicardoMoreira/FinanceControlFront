<section class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
  <h3 class="text-xl font-semibold mb-4 flex items-center gap-2">
    <span class="bg-blue-500/20 text-blue-400 p-1.5 rounded-lg">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z" />
      </svg>
    </span>
    Metas por Categoria
  </h3>
  <div class="space-y-4">
    <div *ngFor="let cat of metas | keyvalue" class="space-y-1">
      <div class="flex justify-between text-sm">
        <span class="text-gray-300">{{ cat.key }}</span>
        <div class="flex gap-2 items-center">
          <span [class]="gastosPorCategoria(cat.key) > cat.value && cat.value > 0 ? 'text-rose-400 font-medium' : 'text-gray-400 font-medium'">
            {{ currency(gastosPorCategoria(cat.key)) }} / {{ currency(cat.value) }}
          </span>
          <button (click)="editMeta.emit(cat.key)" class="text-gray-500 hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
            </svg>
          </button>
        </div>
      </div>
      <div class="w-full bg-gray-700 rounded-full h-1.5">
        <div
          [class]="gastosPorCategoria(cat.key) > cat.value && cat.value > 0 ? 'bg-rose-500' : 'bg-emerald-500'"
          class="h-1.5 rounded-full transition-all duration-500"
          [style.width.%]="cat.value > 0 ? Math.min((gastosPorCategoria(cat.key) / cat.value) * 100, 100) : 0"
        ></div>
      </div>
    </div>
  </div>
</section>
