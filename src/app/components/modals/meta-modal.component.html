<div *ngIf="open" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
  <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700 w-full max-w-md shadow-2xl">
    <h3 class="text-2xl font-bold mb-2">Definir Meta</h3>
    <p class="text-emerald-400 font-medium mb-6">{{ category }}</p>
    <form (ngSubmit)="submit()" class="space-y-4">
      <input
        type="number"
        step="0.01"
        [(ngModel)]="value"
        name="metaValue"
        placeholder="Valor da meta"
        class="w-full bg-gray-700 border-gray-600 rounded-xl px-4 py-3 text-xl focus:ring-2 focus:ring-emerald-500 outline-none transition mb-6"
      />
      <div class="flex gap-3">
        <button type="button" (click)="close.emit()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-xl transition">Cancelar</button>
        <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-bold transition">Definir Meta</button>
      </div>
    </form>
  </div>
</div>
