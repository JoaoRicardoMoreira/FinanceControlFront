<div class="bg-gray-800 rounded-xl border border-gray-700 shadow-lg overflow-hidden">
  <div class="flex border-b border-gray-700">
    <button
      (click)="switchTab('gastos')"
      [class]="activeTab === 'gastos' ? 'flex-1 py-4 text-sm font-bold border-b-2 border-emerald-500 text-emerald-400 bg-emerald-500/5' : 'flex-1 py-4 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:bg-gray-700/50 transition'"
    >
      GASTOS
    </button>
    <button
      (click)="switchTab('rendas')"
      [class]="activeTab === 'rendas' ? 'flex-1 py-4 text-sm font-bold border-b-2 border-emerald-500 text-emerald-400 bg-emerald-500/5' : 'flex-1 py-4 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:bg-gray-700/50 transition'"
    >
      RENDAS
    </button>
  </div>

  <div [class]="activeTab === 'gastos' ? 'block' : 'hidden'">
    <div class="overflow-x-auto custom-scrollbar max-h-[400px]">
      <table class="w-full text-left">
        <thead class="bg-gray-700/50 text-gray-400 text-xs uppercase">
          <tr>
            <th class="px-6 py-3">Data</th>
            <th class="px-6 py-3">Descrição</th>
            <th class="px-6 py-3">Categoria</th>
            <th class="px-6 py-3 text-right">Valor</th>
            <th class="px-6 py-3 text-center">Ações</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-700">
          <tr *ngFor="let gasto of sortedGastos()" class="hover:bg-gray-700/30 transition">
            <td class="px-6 py-4 text-sm text-gray-300">{{ gasto.g.data | date:'dd/MM/yyyy' }}</td>
            <td class="px-6 py-4 text-sm font-medium">{{ gasto.g.desc }}</td>
            <td class="px-6 py-4">
              <span class="px-2 py-1 bg-gray-700 text-gray-300 rounded text-xs">{{ gasto.g.categoria }}</span>
            </td>
            <td class="px-6 py-4 text-sm text-right font-bold text-rose-400">{{ currency(gasto.g.valor) }}</td>
            <td class="px-6 py-4 text-center">
              <button (click)="deleteGasto.emit(gasto.index)" class="text-gray-500 hover:text-rose-500 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div [class]="activeTab === 'rendas' ? 'block' : 'hidden'">
    <div class="overflow-x-auto custom-scrollbar max-h-[400px]">
      <table class="w-full text-left">
        <thead class="bg-gray-700/50 text-gray-400 text-xs uppercase">
          <tr>
            <th class="px-6 py-3">Data</th>
            <th class="px-6 py-3">Descrição</th>
            <th class="px-6 py-3 text-right">Valor</th>
            <th class="px-6 py-3 text-center">Ações</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-700">
          <tr *ngFor="let renda of sortedRendas()" class="hover:bg-gray-700/30 transition">
            <td class="px-6 py-4 text-sm text-gray-300">{{ renda.r.data | date:'dd/MM/yyyy' }}</td>
            <td class="px-6 py-4 text-sm font-medium">{{ renda.r.desc }}</td>
            <td class="px-6 py-4 text-sm text-right font-bold text-emerald-400">{{ currency(renda.r.valor) }}</td>
            <td class="px-6 py-4 text-center">
              <button (click)="deleteRenda.emit(renda.index)" class="text-gray-500 hover:text-rose-500 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
